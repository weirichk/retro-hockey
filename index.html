grid;grid-template-columns:1.45fr 1fr;gap:18px}.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:21px}.card{position:relative;overflow:hidden}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.spaced{margin-top:20px}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:39px;font-weight:950;letter-spacing:-2px}.accent{color:var(--accent)}.gold{color:var(--gold)}.tag{font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 8px;background:#26384d;border-radius:4px;display:inline-block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.stat{padding:10px 0}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}nav{display:flex;gap:7px;margin:20px 0;flex-wrap:wrap}nav button.active{border-color:var(--accent);color:var(--accent)}.bar{height:5px;border-radius:5px;background:#2a3b50;margin-top:8px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}.rating{float:right;font-weight:950;font-size:32px;color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:10px;letter-spacing:1px}.you{background:#b7f512;color:var(--accent)}.scroll{overflow:auto;max-height:600px}.notice{background:#172b40;border:1px solid #355771;padding:12px 16px;border-radius:8px;color:#c5def4;line-height:1.5}.controls{display:flex;gap:17px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:15px 0}kbd{border:1px solid #40516a;border-bottom-width:3px;background:#162237;color:white;padding:3px 6px;border-radius:4px;font:11px monospace}.rink-wrap{position:relative;border:1px solid #3c5777;border-radius:13px;overflow:hidden;background:#061021}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;outline:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-cont <header><div><div class="brand">BLUE<i>LINE</i> <span style="font-size:12px;letter-spacing:2px;font-style:normal;color:#91a5bd">RETRO HOCKEY</span></div><div class="eyebrow" style="margin-top:6px">Build a dynasty. Earn every goal.</div></div><span class="pill">OFFLINE • KEYBOARD • FANTASY NHL</span></header>

<script>
'use strict';
/* BLUE LINE — one file, no dependencies. All ratings/contracts are fictional.
   Teams use a fantasy pool of recognizable NHL players, not live NHL rosters.
   Tuning: CONFIG controls game length; TEAMS/EXTRAS control the player pool. */
const CONFIG={periodSeconds:40,overtimeSeconds:25,seasonGames:10,cap:70,penaltySeconds:12};
const TEAMS=[
['ANA','Anaheim Ducks','#ed6d20','Leo Carlsson','Troy Terry','Lukas Dostal'],['BOS','Boston Bruins','#f2b735','David Pastrnak','Charlie McAvoy','Jeremy Swayman'],['BUF','Buffalo Sabres','#1658a0','Tage Thompson','Rasmus Dahlin','Ukko-Pekka Luukkonen'],['CGY','Calgary Flames','#c92335','Nazem Kadri','MacKenzie Weegar','Dustin Wolf'],['CAR','Carolina Hurricanes','#d72b40','Sebastian Aho','Andrei Svechnikov','Frederik Andersen'],['CHI','Chicago Blackhawks','#d63140','Connor Bedard','Frank Nazar','Spencer Knight'],['COL','Colorado Avalanche','#8d2945','Nathan MacKinnon','Cale Makar','Mackenzie Blackwood'],['CBJ','Columbus Blue Jackets','#32669a','Zach Werenski','Adam Fantilli','Elvis Merzlikins'],['DAL','Dallas Stars','#008e68','Mikko Rantanen','Miro Heiskanen','Jake Oettinger'],['DET','Detroit Red Wings','#dc243e','Dylan Larkin','Lucas Raymond','Cam Talbot'],['EDM','Edmonton Oilers','#ef7623','Connor McDavid','Leon Draisaitl','Stuart Skinner'],['FLA','Florida Panthers','#bc3549','Aleksander Barkov','Matthew Tkachuk','Sergei Bobrovsky'],['LAK','Los Angeles Kings','#687b90','Anze Kopitar','Adrian Kempe','Darcy Kuemper'],['MIN','Minnesota Wild','#18836a','Kirill Kaprizov','Matt Boldy','Filip Gustavsson'],['MTL','Montreal Canadiens','#c83248','Nick Suzuki','Lane Hutson','Sam Montembeault'],['NSH','Nashville Predators','#e9b62d','Filip Forsberg','Roman Josi','Juuse Saros'],['NJD','New Jersey Devils','#d52d44','Jack Hughes','Nico Hischier','Jacob Markstrom'],['NYI','New York Islanders','#ed7831','Mathew Barzal','Bo Horvat','Ilya Sorokin'],['NYR','New York Rangers','#2862b4','Artemi Panarin','Adam Fox','Igor Shesterkin'],['OTT','Ottawa Senators','#c8424b','Brady Tkachuk','Tim Stutzle','Linus Ullmark'],['PHI','Philadelphia Flyers','#e97828','Travis Konecny','Matvei Michkov','Samuel Ersson'],['PIT','Pittsburgh Penguins','#e5bc4f','Sidney Crosby','Evgeni Malkin','Tristan Jarry'],['SJS','San Jose Sharks','#0c929a','Macklin Celebrini','Will Smith','Yaroslav Askarov'],['SEA','Seattle Kraken','#249caf','Matty Beniers','Jared McCann','Joey Daccord'],['STL','St. Louis Blues','#2966ba','Robert Thomas','Jordan Kyrou','Jordan Binnington'],['TBL','Tampa Bay Lightning','#3261b4','Nikita Kucherov','Victor Hedman','Andrei Vasilevskiy'],['TOR','Toronto Maple Leafs','#3269b5','Auston Matthews','William Nylander','Joseph Woll'],['UTA','Utah Mammoth','#76a7d3','Clayton Keller','Logan Cooley','Karel Vejmelka'],['VAN','Vancouver Canucks','#3079b7','Elias Pettersson','Quinn Hughes','Thatcher Demko'],['VGK','Vegas Golden Knights','#b3a176','Jack Eichel','Mark Stone','Adin Hill'],['WSH','Washington Capitals','#d53c48','Alex Ovechkin','Dylan Strome','Logan Thompson'],['WPG','Winnipeg Jets','#517398','Kyle Connor','Mark Scheifele','Connor Hellebuyck']
];
const EXTRAS=['Brayden Point','Jake Guentzel','Jason Robertson','Wyatt Johnston','Brock Faber','Joel Eriksson Ek','Frederick Gaudreau','Mats Zuccarello','Ryan Hartman','Jared Spurgeon','Marco Rossi','Zach Hyman','Evan Bouchard','Darnell Nurse','Drew Doughty','Dylan Guenther','Dylan Cozens','Cole Caufield','Juraj Slafkovsky','Josh Morrissey','Brock Boeser','Bobby Brink','Alex DeBrincat','Moritz Seider','Seth Jarvis','Jaccob Slavin','Jesper Bratt','Dougie Hamilton','Chris Kreider','Vincent Trocheck','Noah Dobson','Owen Power','Alex Tuch','John Tavares','Morgan Rielly','Charlie Coyle','Brad Marchand','Sam Reinhart','Aaron Ekblad','Brandon Hagel','Anthony Cirelli','Thomas Chabot','Drake Batherson','Shane Pinto','Owen Tippett','Olen Zellweger','Mason McTavish','Cutter Gauthier','Pavel Buchnevich','Colton Parayko','Ryan OReilly','Jonathan Marchessault','Dmitry Orlov','William Karlsson','Tomas Hertl','Shea Theodore','Jake Walman','Jonathan Drouin','Martin Necas','Devon Toews','Bryan Rust','Rickard Rakell','Kris Letang','Damon Severson'];
const STARS=['Connor McDavid','Nathan MacKinnon','Cale Makar','Leon Draisaitl','Nikita Kucherov','Auston Matthews','Kirill Kaprizov','Quinn Hughes','Connor Hellebuyck','Igor Shesterkin'];
const D_NAMES=/Makar|Hughes|Hedman|McAvoy|Dahlin|Weegar|Werenski|Heiskanen|Hutson|Josi|Fox|Dobson|Power|Rielly|Seider|Slavin|Hamilton|Bouchard|Nurse|Doughty|Morrissey|Ekblad|Chabot|Faber|Spurgeon|Zellweger|Parayko|Orlov|Theodore|Walman|Toews|Letang|Severson/;
const STORE='blueline-franchise-v1', app=document.getElementById('app');
let state=null, tab='club', game=null, raf=0, key={}, last=0, soundOn=false,audioCtx=null,toastTimer;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let n=2166136261;for(const c of s)n=Math.imul(n^c.charCodeAt(0),16777619);return n>>>0}
function player(name,team,pos){const n=hash(name),base=STARS.includes(name)?90:68+n%21;const d=pos==='D';return {id:name,name,team,pos,speed:clamp(base+(n%9)-4,55,98),shot:clamp(base+(n%13)-6-(d?4:0),55,98),skill:clamp(base+(n%7)-3,55,98),def:clamp(base+(n%11)-5+(d?6:0),55,98),potential:clamp(base+3+n%8,base,99),salary:Math.round((2+(base-65)*.2)*10)/10,xp:0,g:0,a:0,training:0}}
const POOL=[];TEAMS.forEach((t,i)=>{POOL.push(player(t[3],i,/Cale|Zach Werenski|Rasmus/.test(t[3])?'D':'F'),player(t[4],i,D_NAMES.test(t[4])&&!/Jack Hughes/.test(t[4])?'D':'F'),player(t[5],i,'G'))});EXTRAS.forEach((n,i)=>{if(!POOL.some(p=>p.id===n))POOL.push(player(n,i%32,D_NAMES.test(n)?'D':'F'))});
const overall=p=>Math.round((p.speed+p.shot+p.skill+p.def)/4),money=()=>Math.round(state.roster.reduce((s,p)=>s+p.salary,0)*10)/10;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3500)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){toast('Browser saving unavailable. Use Export save to keep your franchise.')}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));if(validSave(s))state=s}catch(e){} }
function validSave(s){return s&&s.version===1&&Number.isInteger(s.team)&&s.team>=0&&s.team<32&&Array.isArray(s.roster)&&s.roster.length<=7&&s.roster.every(p=>POOL.some(q=>q.id===p.id)&&['speed','shot','skill','def','salary','xp','g','a','potential'].every(k=>Number.isFinite(p[k])&&p[k]>=0))&&new Set(s.roster.map(p=>p.id)).size===s.roster.length&&Array.isArray(s.table)&&s.table.length===32&&s.table.every(t=>['id','w','l','ot','gf','ga'].every(k=>Number.isInteger(t[k])&&t[k]>=0)&&t.id<32)&&Array.isArray(s.schedule)&&s.schedule.length===CONFIG.seasonGames&&s.schedule.every(n=>Number.isInteger(n)&&n>=0&&n<32&&n!==s.team)&&Number.isInteger(s.week)&&s.week>=0&&s.week<=CONFIG.seasonGames&&Number.isFinite(s.credits)&&s.credits>=0&&Number.isInteger(s.year)&&s.year>0&&['draft','season','playoffs','complete'].includes(s.phase)&&(s.phase!=='complete'||Number.isInteger(s.champion)&&s.champion>=0&&s.champion<32)&&Number.isInteger(s.playRound)&&s.playRound>=0&&s.playRound<=2&&new Set(s.table.map(t=>t.id)).size===32&&Array.isArray(s.draftOffers)&&s.draftOffers.every(id=>POOL.some(p=>p.id===id))&&Array.isArray(s.market)&&s.market.every(id=>POOL.some(p=>p.id===id))&&Array.isArray(s.log)&&s.log.every(x=>typeof x==='string')&&Number.isInteger(s.line)&&[0,1].includes(s.line)&&Number.isFinite(s.trophies)&&Number.isFinite(s.points)&&['balanced','attack','trap'].includes(s.tactic)&&['rookie','pro','elite'].includes(s.difficulty)&&Array.isArray(s.bracket)&&s.bracket.every(n=>Number.isInteger(n)&&n>=0&&n<32)&&[0,2,4,8].includes(s.bracket.length)&&(s.phase!=='draft'||s.roster.length<7)&&(s.phase==='draft'||s.roster.length===7&&s.roster.filter(p=>p.pos==='G').length===1)}
function init(){app.innerHTML=`<section class="hero"><div class="eyebrow accent">THE FRANCHISE IS YOURS</div><h1>Small rink.<br>Big dynasty.</h1><p>Draft the stars. Build your lines. Take the ice in fast, full-rink arcade hockey. Thirty-two NHL clubs, a fantasy player pool, and one championship to chase.</p><div class="row spaced"><select id="teamSelect" aria-label="Choose your team">${TEAMS.map((t,i)=>`<option value="${i}" ${i===13?'selected':''}>${t[1]}</option>`).join('')}</select><select id="difficulty" aria-label="Difficulty"><option value="rookie">Rookie · learn the ropes</option><option value="pro" selected>Pro · balanced challenge</option><option value="elite">Elite · relentless AI</option></select><button class="primary" data-action="new">Start fantasy draft →</button>${state?'<button data-action="continue">Continue franchise</button>':''}</div><div class="row spaced"><button data-action="import">Import save</button><span class="small muted">No install. No external assets. Play offline.</span></div></section><div class="grid spaced"><div class="panel"><div class="eyebrow">01 / BUILD</div><h3 class="spaced">Draft your identity</h3><p>Seven picks. Six skaters and a goalie. Balance speed, skill, defense, and a $70M fantasy cap.</p></div><div class="panel"><div class="eyebrow">02 / PLAY</div><h3 class="spaced">Own the blue line</h3><p>Charge shots, find the one-timer, finish your checks. Three 40-second periods. You always attack right.</p></div><div class="panel"><div class="eyebrow">03 / REPEAT</div><h3 class="spaced">Build something lasting</h3><p>Train your stars, work the free-agent market, and reach the eight-team championship bracket.</p></div></div>${foot()}`}
function foot(){return '<footer>Unofficial fan-made game. NHL and team names belong to their owners. Fictional ratings, salaries, fantasy assignments, and simplified rules; this is not a live roster database. No icing or offsides. Browser save resumes between games; an unfinished game restarts. Keyboard required. Source is entirely inside this HTML file.</footer>'}
function newFranchise(){const t=+document.getElementById('teamSelect').value,d=document.getElementById('difficulty').value;state={version:1,team:t,difficulty:d,year:1,trophies:0,phase:'draft',roster:[],credits:8,line:0,tactic:'balanced',draftOffers:[],market:[],week:0,points:0,log:[],table:[],schedule:[],bracket:[],playRound:0};resetSeason();offerDraft();save();render()}
function resetSeason(){state.table=TEAMS.map((t,id)=>({id,w:0,l:0,ot:0,gf:0,ga:0}));state.week=0;state.schedule=shuffle(TEAMS.map((t,i)=>i).filter(i=>i!==state.team)).slice(0,CONFIG.seasonGames);state.bracket=[];state.playRound=0;state.log=[];state.market=[]}
function offerDraft(){let isG=state.roster.length===3;let available=POOL.filter(p=>!state.roster.some(q=>q.id===p.id)&&(isG?p.pos==='G':p.pos!=='G'));state.draftOffers=shuffle(available).slice(0,6).map(p=>p.id)}
function draft(id){if(state.phase!=='draft'||!state.draftOffers.includes(id))return;const p=POOL.find(p=>p.id===id);if(money()+p.salary>CONFIG.cap)return toast('Over the salary cap. Pick a less expensive player.');state.roster.push({...p});if(state.roster.length===7){state.phase='season';market();state.log.unshift('Fantasy draft complete. Your championship chase starts now.')}else offerDraft();save();render()}
function market(){state.market=shuffle(POOL.filter(p=>!state.roster.some(q=>q.id===p.id))).slice(0,6).map(p=>p.id)}
function card(p,action='',label='Draft player'){return `<div class="card"><span class="rating">${overall(p)}</span><span class="tag">${p.pos==='G'?'GOALIE':p.pos==='D'?'DEFENSE':'FORWARD'}</span><h3 style="margin-top:14px;padding-right:35px">${esc(p.name)}</h3><div class="small muted">${TEAMS[p.team][0]} player pool · potential ${p.potential}</div><div class="stats">${[['SPD',p.speed],['SHOT',p.shot],['SKILL',p.skill],['DEF',p.def]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div><div class="row between"><span class="gold">$${p.salary.toFixed(1)}M</span>${action?`<button data-action="${action}" data-id="${esc(p.id)}" ${action==='draft'&&money()+p.salary>CONFIG.cap?'disabled':''}>${label}</button>`:''}</div></div>`}
function render(){if(game)return;const t=TEAMS[state.team];if(state.phase==='draft'){app.innerHTML=`<div class="row between"><div><div class="eyebrow accent">${t[1]} / SEASON ${state.year}</div><h2 class="spaced">The fantasy draft</h2></div><div><span class="big">${state.roster.length+1}<span class="muted" style="font-size:20px"> / 7</span></span></div></div><p>${state.roster.length===3?'Protect the crease. Choose your starting goalie.':'Choose your next skater. All six skaters can play any of the three on-ice positions.'} Drafted NHL names are reassigned to your fantasy franchise.</p><div class="row between"><span class="tag">CAP USED $${money().toFixed(1)}M / $70M</span><span class="small muted">Ratings & contracts are fictional. No draft timer.</span></div><div class="draftorder">${Array.from({length:7},(_,i)=>`<span class="${i===state.roster.length?'current':''}">${i+1}. ${state.roster[i]?esc(state.roster[i].name.split(' ').slice(-1)[0]):i===3?'GOALIE':'SKATER'}</span>`).join('')}</div><div class="grid">${state.draftOffers.map(id=>card(POOL.find(p=>p.id===id),'draft')).join('')}</div>${foot()}`;return}
app.innerHTML=`<div class="row between"><div><div class="eyebrow accent">SEASON ${state.year} / ${esc(state.difficulty.toUpperCase())}</div><h2 class="spaced" style="font-size:32px">${t[1]}</h2></div><div class="row"><span class="pill">${state.trophies} CHAMPIONSHIPS</span><button data-action="export">Export save</button><button data-action="home">Menu</button></div></div><nav>${['club','roster','market','league','help'].map(x=>`<button data-action="tab" data-id="${x}" class="${tab===x?'active':''}">${({club:'Clubhouse',roster:'Lines & training',market:'Free agents',league:'Standings',help:'How to play'})[x]}</button>`).join('')}</nav><section id="content"></section>${foot()}`;const c=document.getElementById('content');
if(tab==='club')c.innerHTML=club();if(tab==='roster')c.innerHTML=roster();if(tab==='league')c.innerHTML=league();if(tab==='market')c.innerHTML=freeAgents();if(tab==='help')c.innerHTML=help();}

ctx.strokeStyle='#423b35';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+8,y+3);ctx.lineTo(x+a.fx*25,y+a.fy*20+15);ctx.lineTo(x+a.fx*33,y+a.fy*20+14);ctx.stroke();ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillStyle=a.side?'#12223b':'#fff';ctx.fillText(a.slot===9?'G':String(1+hash(a.p.name)%97),x,y+3);if(a.stun>0){ctx.fillStyle='#ffb62b';ctx.font='16px monospace';ctx.fillText('* *',x,y-26)}
if(isYou||game.puck.owner===a){ctx.font='bold 10px monospace';ctx.fillStyle='#10263c';ctx.fillText(a.p.name.split(' ').slice(-1)[0].toUpperCase(),x,y+39)} }
let accumulator=0;
function loop(t){if(!game)return;let dt=Math.min((t-last)/1000,.1);last=t;accumulator+=dt;while(accumulator>=1/120){update(1/120);accumulator-=1/120}draw();if(game&&!game.finished)raf=requestAnimationFrame(loop);}
